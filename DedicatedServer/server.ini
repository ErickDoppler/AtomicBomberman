; Atomic Bomberman dedicated server - settings
; The file is read when the server starts; restart the server after editing it.

[server]
; The name of this server (shown in the server log).
name = Atomic Bomberman Dedicated Server
; TCP port the players connect to (1 - 65535).
port = 5000
; Address to listen on: 0.0.0.0 = every network interface (IPv4).
bind = 0.0.0.0
; Players the server accepts at the same time (1 - 10). The server has no player of its own.
max_players = 10
; A player that is not heard from for this many seconds is dropped (the game's own fuse is 4 seconds).
fuse_seconds = 4
; Log file; empty = the log goes to the console only. A relative path is relative to this folder.
log_file = server.log
